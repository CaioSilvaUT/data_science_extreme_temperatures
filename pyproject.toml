[project]
name = "data-science-extreme-temperatures"
version = "0.1.0"
description = "projeto de ciencia de dados"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "holidays>=0.108",
    "ipykernel>=7.4.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
]

[project.scripts]
data-science-extreme-temperatures = "data_science_extreme_temperatures:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
